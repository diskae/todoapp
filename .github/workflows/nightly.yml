name: Nightly Build & Test

on:
  schedule:
    # Запуск каждый день в 02:00 UTC (ночной билд)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Возможность запуска вручную из интерфейса GitHub Actions

jobs:
  nightly-check:
    name: Run Nightly Tests and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests and verify build stability
        run: ./gradlew --no-daemon clean test build
